name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Auto-locate and Build with Gradle
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f "tem-hs-app-v2/gradlew" ]; then
            cd tem-hs-app-v2
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            GRADLEW_DIR=$(find . -name "gradlew" -exec dirname {} \; | head -n 1)
            echo "Found gradlew in: $GRADLEW_DIR"
            cd "$GRADLEW_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: DocMauTem-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'


name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Locate Android project
        shell: bash
        run: |
          if [ -d "tem-hs-app-v2" ]; then
            echo "PROJECT_DIR=tem-hs-app-v2" >> $GITHUB_ENV
          else
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          fi

      - name: Check Gradle Wrapper
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: Missing gradle-wrapper.jar"
            echo "Please add the Gradle Wrapper JAR to the repository."
            exit 1
          fi

          if [ ! -f "gradlew" ]; then
            echo "ERROR: Missing gradlew"
            exit 1
          fi

          chmod +x gradlew

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DocMauTem-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
